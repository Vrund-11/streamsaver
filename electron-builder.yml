appId: com.yotubevideodownloader.app
productName: YoTube Video Downloader
copyright: "Copyright © 2024 YoTube Video Downloader"

directories:
  output: dist
  buildResources: assets

files:
  - out/**/*

extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"

win:
  sign: false
  forceCodeSigning: false
  target:
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64

portable:
  artifactName: YoTubeVideoDownloader-${version}-portable.exe

appx:
  artifactName: "YoTube Video Downloader ${version}.msix"
  applicationId: YoTubeVideoDownloader
  backgroundColor: "#0d0d1a"
  displayName: YoTube Video Downloader
  identityName: MaxupApps.YoTubeVideoDownloader
  publisher: "CN=D13CE171-94D0-4CF7-9DE0-84DB0B762915"
  publisherDisplayName: MaxupApps
  languages:
    - en-US
    - en-IN
